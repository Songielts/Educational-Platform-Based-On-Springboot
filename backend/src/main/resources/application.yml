server:
  port: 8080
  servlet:
    context-path: /api
  # ==================== 400并发核心配置：Tomcat线程池 ====================
  tomcat:
    max-threads: 300              # 最大线程数（400并发推荐200-300）
    min-spare-threads: 50         # 最小空闲线程
    max-connections: 1000         # 最大连接数
    connection-timeout: 120000    # 连接超时120秒（大文件上传需要）
    accept-count: 200             # 排队队列长度

spring:
  application:
    name: smart-edu-platform

  # ==================== 数据库连接池（400并发优化）====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_edu?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Shuangxing0@
    hikari:
      minimum-idle: 20            # 最小空闲连接（原5→20）
      maximum-pool-size: 100      # 最大连接数（原20→100，400并发核心）
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SmartEduHikariPool

  # ==================== Redis连接池（400并发优化）====================
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    lettuce:
      pool:
        max-active: 50            # Redis最大连接数（原8→50）
        max-idle: 20              # 最大空闲连接（原8→20）
        min-idle: 5               # 最小空闲连接（原0→5）
        max-wait: 3000ms          # 最大等待时间（原-1→3000ms）
    timeout: 5000ms

  # ==================== 文件上传配置 ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 1GB
      max-request-size: 1GB
      file-size-threshold: 20MB

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 587
    username: 1491878200@qq.com
    password: wgszonmcjpzyjeie
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ==================== 业务配置 ====================
app:
  email:
    code-expire-minutes: 5        # 验证码5分钟有效
    send-limit: 10                # 每日同邮箱最多发10次

# MyBatis Plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    cache-enabled: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT配置
jwt:
  secret: smart-edu-platform-secret-key-2024-secure-jwt-token
  expiration: 86400000
  header: Authorization
  prefix: Bearer

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: smart-edu-bucket
    domain: https://smart-edu-bucket.oss-cn-hangzhou.aliyuncs.com

# 文件上传配置（本地存储路径）
upload:
  path: D:/Online study/smart-edu-platform/uploads
  video-path: videos/
  image-path: images/
  doc-path: docs/
  max-video-size: 1073741824     # 1GB（支持500MB及以上视频上传）
  max-image-size: 10485760       # 10MB
  max-doc-size: 52428800         # 50MB

# 日志配置（调低级别减少性能开销）
logging:
  level:
    com.smartedu: info
    org.springframework.security: warn
    org.springframework.web: warn
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

